name: Project checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: simeval_ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: simeval_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U simeval_ci -d simeval_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # 仅临时 CI 数据；测试地址与开发占位地址分开，防误清理门禁仍然生效。
      DATABASE_URL: postgresql://simeval_ci:ci-only-password@127.0.0.1:5432/simeval_ci
      TEST_DATABASE_URL: postgresql://simeval_ci:ci-only-password@127.0.0.1:5432/simeval_test
      AUTH_SECRET: ci-only-secret-of-at-least-32-characters
      DEMO_PASSWORD: ci-only-demo-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run build
