    post:
      tags:
        - Report
      operationId: createAiReport
      x-implementation-status: implemented
      x-roles:
        - ENGINEER
        - REVIEWER
      summary: 生成或更新当前任务唯一的系统报告
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReportRequest'
            example:
              runId: demo-run-candidate
      responses:
        '200':
          description: 成功；首次创建、来源未变复用或更新原报告，均返回 200
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    $ref: '#/components/schemas/Report'
                  meta:
                    $ref: '#/components/schemas/RequestMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '500':
          $ref: '#/components/responses/InternalError'
      description: >-
        严格请求正文仅含 runId，使用普通业务鉴权，不依赖 accessId、聊天会话或轮次。任务须成功且可见。
        每任务至多一份当前报告；来源未变化时保留原正文和确认，来源变化时更新同一 ID、恢复 READY 并清除旧确认。
        更新前正文、来源与确认信息写入审计。固定模板整理当前指标和人工结论，不调用模型、不消费 AI 额度。
