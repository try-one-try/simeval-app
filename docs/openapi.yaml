            $ref: '#/components/schemas/ReviewHistory'
        staleReportCount:
          type: integer
          minimum: 0
    SampleEnvelope:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          $ref: '#/components/schemas/SampleDetail'
        meta:
          $ref: '#/components/schemas/RequestMeta'
    SampleListEnvelope:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Sample'
        meta:
          $ref: '#/components/schemas/PageMeta'
    AssignmentRequest:
