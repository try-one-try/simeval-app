        expectedVersion:
          type: integer
          minimum: 0
    ReviewEnvelope:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          $ref: '#/components/schemas/SampleDetail'
        meta:
          $ref: '#/components/schemas/RequestMeta'
    CreateAssistantSession:
      type: object
      required:
        - runId
