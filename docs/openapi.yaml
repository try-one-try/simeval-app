      description: 固定仓储项目目录，无查询参数；含安全项目概要、两模型、嵌套质量报告、两基准的兼容关系／范围／规则、可用成功基线、本人最近任务和容量。
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: authjs.session-token
      description: Auth.js Session Cookie；生产环境可能有 Secure 前缀，开发为 authjs.session-token，HTTPS 由 Auth.js 使用 Secure 前缀。
  parameters:
    DatasetId:
      name: datasetId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ResourceId'
    RunId:
      name: runId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ResourceId'
    SampleId:
      name: sampleId
      in: path
      required: true
      schema:
        type: string
    ReportId:
      name: reportId
      in: path
      required: true
      schema:
        type: string
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 同一操作者、同一键、同一请求返回同一资源；同键不同请求返回 409。
      schema:
        type: string
        minLength: 1
        maxLength: 128
  responses:
    InternalError:
      description: 未预期错误，返回通用信息与请求号
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: 未登录
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: 角色或任务归属无权限，或写入 Origin 不匹配
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: 状态、版本或幂等冲突
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unprocessable:
      description: 参数或业务门禁不满足
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ExternalServiceError:
      description: Provider 暂不可用
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    ResourceId:
      type: string
      minLength: 1
      maxLength: 64
      pattern: ^[a-zA-Z0-9_-]+$
    RequestMeta:
      type: object
      required:
      - requestId
      properties:
        requestId:
          type: string
          example: req_123
    PageMeta:
      allOf:
      - $ref: '#/components/schemas/RequestMeta'
      - type: object
        required:
        - page
        - pageSize
        - total
        properties:
          page:
            type: integer
            minimum: 1
          pageSize:
            type: integer
            minimum: 1
          total:
            type: integer
            minimum: 0
    ErrorEnvelope:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          - requestId
          properties:
            code:
              type: string
              example: STATE_CONFLICT
            message:
              type: string
              example: 当前状态不能执行该操作
            fieldErrors:
              type:
              - object
              - 'null'
              additionalProperties:
                type: array
                items:
                  type: string
            requestId:
              type: string
              example: req_123
    QualityStatus:
      type: string
      enum:
      - PASSED
      - WARNING
      - FAILED
    RunStatus:
      type: string
      enum:
      - QUEUED
      - RUNNING
      - SUCCEEDED
      - FAILED
      - CANCELLED
    SampleStatus:
      type: string
      enum:
      - OPEN
      - IN_REVIEW
      - RESOLVED
      - REOPENED
    ReportStatus:
      type: string
      enum:
      - READY
      - FAILED
      - CONFIRMED
    QualityEnvelope:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: object
          required:
          - dataset
          - checks
          - canStartEvaluation
          properties:
            dataset:
              type: object
              required:
              - id
              - name
              - version
              - sampleCount
              - qualityStatus
              properties:
                id:
                  type: string
                name:
                  type: string
                version:
                  type: string
                sampleCount:
                  type: integer
                  minimum: 0
                qualityStatus:
                  $ref: '#/components/schemas/QualityStatus'
            checks:
              type: array
              items:
                type: object
                required:
                - key
                - name
                - status
                - affectedCount
                - message
                properties:
                  key:
                    type: string
                  name:
                    type: string
                  status:
                    $ref: '#/components/schemas/QualityStatus'
                  affectedCount:
                    type: integer
                    minimum: 0
                  message:
                    type: string
            canStartEvaluation:
              type: boolean
        meta:
          $ref: '#/components/schemas/RequestMeta'
    CreateRunRequest:
      type: object
      additionalProperties: false
      required:
      - name
      - modelVersionId
      - datasetVersionId
      - benchmarkId
      - episodeCount
      - simulationSeed
      - acceptQualityWarning
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        modelVersionId:
          $ref: '#/components/schemas/ResourceId'
        datasetVersionId:
          $ref: '#/components/schemas/ResourceId'
        benchmarkId:
          $ref: '#/components/schemas/ResourceId'
        baselineRunId:
          anyOf:
          - $ref: '#/components/schemas/ResourceId'
          - type: 'null'
          description: 可省略；有基线才要求成功、同口径、不同模型且未被软删除。
        episodeCount:
          type: integer
          minimum: 1
          maximum: 10000
          description: 还须满足所选目录范围：综合 50–1000，遮挡 50–500，不超过数据上限。
        simulationSeed:
          type: integer
          minimum: 0
          maximum: 2147483647
        acceptQualityWarning:
          type: boolean
        mockFailure:
          type: boolean
          default: false
          description: 明确的故障演示，重试默认清除
        targetSuccessRate:
          type:
          - number
          - 'null'
          enum:
          - 0.8
          - 0.85
          - null
          description: 可选总体成功率目标，与比较基线不同；目标不改变模拟结果。
    Run:
      type: object
      required:
      - id
      - projectId
      - name
      - status
      - modelVersionId
      - datasetVersionId
      - benchmarkId
      - baselineRunId
      - retryOfRunId
      - episodeCount
      - simulationSeed
      - provider
      - createdAt
      - startedAt
      - finishedAt
      - errorCode
      - errorMessage
      - anomalyCount
      - modelName
      - modelVersion
      - datasetName
      - datasetVersion
      - benchmarkName
      - benchmarkVersion
      - createdById
      - isDemoFixture
      - targetSuccessRate
      - pendingReviewCount
      - successRule
      - metrics
      properties:
        id:
          type: string
        projectId:
          type: string
        name:
          type: string
        status:
          $ref: '#/components/schemas/RunStatus'
        modelVersionId:
          type: string
        datasetVersionId:
          type: string
        benchmarkId:
          type: string
        baselineRunId:
          type:
          - string
          - 'null'
        retryOfRunId:
          type:
          - string
          - 'null'
        episodeCount:
          type: integer
        simulationSeed:
          type: integer
        provider:
          type: string
          example: MockEvaluationProvider
        createdAt:
          type: string
          format: date-time
        startedAt:
          type:
          - string
          - 'null'
          format: date-time
        finishedAt:
          type:
          - string
          - 'null'
          format: date-time
        errorCode:
          type:
          - string
          - 'null'
        errorMessage:
          type:
          - string
          - 'null'
        anomalyCount:
          type: integer
          minimum: 0
        modelName:
          type: string
        modelVersion:
          type: string
        datasetName:
          type: string
        datasetVersion:
          type: string
        benchmarkName:
          type: string
        benchmarkVersion:
          type: string
        createdById:
          type: string
        isDemoFixture:
          type: boolean
        targetSuccessRate:
          type:
          - number
          - 'null'
          enum:
          - 0.8
          - 0.85
          - null
        pendingReviewCount:
          type: integer
          minimum: 0
        successRule:
          type: string
        metrics:
          type: array
          items:
            type: object
            required:
            - key
            - name
            - unit
            - scenarioKey
            - value
            - sampleCount
            properties:
              key:
                type: string
              name:
                type: string
              unit:
                type: string
              scenarioKey:
                type: string
              value:
                type: number
              sampleCount:
                type: integer
                minimum: 1
    RunEnvelope:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          $ref: '#/components/schemas/Run'
        meta:
          $ref: '#/components/schemas/RequestMeta'
    RunListEnvelope:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Run'
        meta:
          $ref: '#/components/schemas/PageMeta'
    RunStatusEnvelope:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: object
          required:
          - runId
          - status
          - progress
          - pollAfterMs
          properties:
            runId:
              type: string
            status:
              $ref: '#/components/schemas/RunStatus'
            progress:
              type:
              - number
              - 'null'
              minimum: 0
              maximum: 1
              description: 成功为 1，其余状态 null，不编造执行百分比
            startedAt:
              type:
              - string
              - 'null'
              format: date-time
            finishedAt:
              type:
              - string
              - 'null'
              format: date-time
            pollAfterMs:
              type: integer
              minimum: 0
        meta:
          $ref: '#/components/schemas/RequestMeta'
    ComparisonEnvelope:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          $ref: '#/components/schemas/ComparisonData'
        meta:
          $ref: '#/components/schemas/RequestMeta'
    Sample:
      type: object
      required:
      - id
      - runId
      - sampleNumber
      - scenarioKey
      - metricKey
      - anomalyType
      - title
      - status
      - version
      - logExcerpt
      - mediaPath
      - conclusion
      - draftConclusion
      - draftUpdatedBy
      - confirmedBy
      - draftUpdatedAt
      - confirmedAt
      - confirmedRevision
      - pendingReview
      properties:
        id:
          type: string
        runId:
          type: string
        sampleNumber:
          type: string
        scenarioKey:
          type: string
        metricKey:
          type: string
        anomalyType:
          type: string
        title:
          type: string
        status:
          $ref: '#/components/schemas/SampleStatus'
        version:
          type: integer
          minimum: 1
        logExcerpt:
          type:
          - string
          - 'null'
        mediaPath:
          type:
          - string
          - 'null'
        conclusion:
          type:
          - string
          - 'null'
        draftConclusion:
          type:
          - string
          - 'null'
        draftUpdatedBy:
          $ref: '#/components/schemas/ReviewPerson'
        confirmedBy:
          $ref: '#/components/schemas/ReviewPerson'
        draftUpdatedAt:
          type:
          - string
          - 'null'
          format: date-time
        confirmedAt:
          type:
          - string
          - 'null'
          format: date-time
        confirmedRevision:
          type: integer
          minimum: 0
        pendingReview:
          type: boolean
          description: 未确认，或有未确认的新草稿。
    SampleDetail:
      type: object
      required:
      - sample
      - run
      - history
      - staleReportCount
      properties:
