  /api/ai-reports/{reportId}/confirm:
    post:
      tags:
        - Report
      operationId: confirmAiReport
      x-implementation-status: implemented
      x-roles:
        - REVIEWER
      summary: 评测人员核对所读版本及当前来源后确认系统报告
      description: >-
        普通业务鉴权，仅 REVIEWER。expectedSourceHash 必须来自刚读取的 Report.sourceHash。
        报告已由他人更新时返回 409 VERSION_CONFLICT；评测来源变化时返回 409 SOURCE_CHANGED。
        已确认且来源及版本一致时复用原确认。确认写入审计，不调用模型。
