openapi: 3.1.0
info:
  title: SimEval HTTP API
  version: 0.9.0
  description: 合成数据与模拟执行；23 项业务操作已实现，指派和重开 2 项为 planned。Agent 仅用于聊天调查，每任务维护一份独立系统报告；本地手工验收与生产发布待完成。
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
tags:
- name: Catalog
  description: 评测配置目录与兼容性
- name: DataQuality
  description: 数据集质量
- name: Evaluation
  description: 评测任务
- name: Comparison
  description: 模型对比
- name: Anomaly
  description: 异常样本与复核
- name: Report
  description: 单任务系统评测报告与人工确认；保留 ai-reports 历史路径，不调用模型
- name: Assistant
  description: 登录隔离的评测调查与有限执行
security:
- sessionCookie: []
paths:
  /api/datasets/{datasetId}/quality:
    get:
      tags:
      - DataQuality
      operationId: getDatasetQuality
      x-implementation-status: implemented
      summary: 获取数据集质量摘要与检查项
      x-roles:
      - ENGINEER
      - REVIEWER
      parameters:
      - $ref: '#/components/parameters/DatasetId'
      responses:
        200:
          description: 质量报告
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QualityEnvelope'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        422:
          $ref: '#/components/responses/Unprocessable'
        500:
          $ref: '#/components/responses/InternalError'
  /api/evaluation-runs:
    get:
      tags:
      - Evaluation
      operationId: listEvaluationRuns
      x-implementation-status: implemented
      summary: 按创建时间倒序查询评测任务
      x-roles:
      - ENGINEER
      - REVIEWER
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/RunStatus'
      - name: projectId
        in: query
        schema:
          $ref: '#/components/schemas/ResourceId'
      responses:
        200:
          description: 任务列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunListEnvelope'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        422:
          $ref: '#/components/responses/Unprocessable'
        500:
          $ref: '#/components/responses/InternalError'
      description: 过滤软删除；共享列表按创建时间和 ID 倒序，显式选择任务。
    post:
      tags:
      - Evaluation
      operationId: createEvaluationRun
      x-implementation-status: implemented
      summary: 创建模拟评测任务
      x-roles:
      - ENGINEER
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRunRequest'
      responses:
        200:
          description: 相同幂等请求返回已有任务
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunEnvelope'
        201:
          description: 已创建 QUEUED 任务
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunEnvelope'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        409:
          $ref: '#/components/responses/Conflict'
        422:
          $ref: '#/components/responses/Unprocessable'
        500:
          $ref: '#/components/responses/InternalError'
        503:
          $ref: '#/components/responses/ExternalServiceError'
      description: 默认不依赖基线。按目录验证兼容性／Episode 范围／质量；同账号至多三条进行中任务，满额返回 409 TASK_LIMIT_REACHED。保存配置快照与审计，幂等重放不占新名额。
  /api/evaluation-runs/{runId}:
    get:
      tags:
      - Evaluation
      operationId: getEvaluationRun
      x-implementation-status: implemented
      summary: 获取任务详情、配置与结果摘要
      x-roles:
      - ENGINEER
      - REVIEWER
      parameters:
      - $ref: '#/components/parameters/RunId'
      responses:
        200:
          description: 任务详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunEnvelope'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        422:
          $ref: '#/components/responses/Unprocessable'
        500:
          $ref: '#/components/responses/InternalError'
      description: 被软删除的任务返回 404；数据库内部引用仍保留。
    delete:
      tags:
      - Evaluation
      operationId: deleteEvaluationRun
      x-implementation-status: implemented
      x-roles:
      - ENGINEER
      summary: 软删除本人已结束任务
      description: 仅本人 SUCCEEDED／FAILED／CANCELLED，固定示例保护；进行中先取消。保留证据、基线和审计引用；普通列表过滤，重复删除 200。服务端校验会话／Origin／状态并记录审计。
      parameters:
      - $ref: '#/components/parameters/RunId'
      responses:
        200:
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteRunEnvelope'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        409:
          $ref: '#/components/responses/Conflict'
        422:
          $ref: '#/components/responses/Unprocessable'
        500:
          $ref: '#/components/responses/InternalError'
  /api/evaluation-runs/{runId}/status:
    get:
      tags:
      - Evaluation
      operationId: getEvaluationRunStatus
      x-implementation-status: implemented
      summary: 只读获取已保存的任务状态
      x-roles:
      - ENGINEER
      - REVIEWER
      parameters:
      - $ref: '#/components/parameters/RunId'
      responses:
        200:
          description: 当前状态与建议轮询间隔
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunStatusEnvelope'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        422:
          $ref: '#/components/responses/Unprocessable'
        500:
          $ref: '#/components/responses/InternalError'
  /api/evaluation-runs/{runId}/sync:
    post:
      tags:
      - Evaluation
      operationId: syncEvaluationRun
      x-implementation-status: implemented
      summary: 根据服务器时间推进模拟任务，到期后事务性写入一次结果
      x-roles:
      - ENGINEER
      - REVIEWER
      description: 每次最多推进一段；创建后满 1 秒排队转运行、满 4 秒运行转终态。无后台执行。并发只生成一组结果；所有 POST 须同源 Origin。
      parameters:
      - $ref: '#/components/parameters/RunId'
      responses:
        200:
          description: 当前状态与建议轮询间隔
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunStatusEnvelope'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        422:
          $ref: '#/components/responses/Unprocessable'
        500:
          $ref: '#/components/responses/InternalError'
        503:
          $ref: '#/components/responses/ExternalServiceError'
  /api/evaluation-runs/{runId}/cancel:
    post:
      tags:
      - Evaluation
      operationId: cancelEvaluationRun
      x-implementation-status: implemented
      summary: 取消尚未进入终态的任务
      x-roles:
      - ENGINEER
      parameters:
      - $ref: '#/components/parameters/RunId'
      responses:
        200:
          description: 取消后的任务
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunEnvelope'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        409:
          $ref: '#/components/responses/Conflict'
        422:
          $ref: '#/components/responses/Unprocessable'
        500:
          $ref: '#/components/responses/InternalError'
  /api/evaluation-runs/{runId}/retry:
    post:
      tags:
      - Evaluation
      operationId: retryEvaluationRun
      x-implementation-status: implemented
      summary: 为失败任务创建新任务，原任务不覆盖
      x-roles:
      - ENGINEER
      parameters:
      - $ref: '#/components/parameters/RunId'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        200:
          description: 相同幂等请求返回已有重试任务
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunEnvelope'
        201:
          description: 新的 QUEUED 任务
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunEnvelope'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        409:
          $ref: '#/components/responses/Conflict'
        422:
          $ref: '#/components/responses/Unprocessable'
        500:
          $ref: '#/components/responses/InternalError'
        503:
          $ref: '#/components/responses/ExternalServiceError'
  /api/comparisons:
    get:
      tags:
      - Comparison
      operationId: compareEvaluationRuns
      x-implementation-status: implemented
      summary: 比较两个已成功任务的同口径指标
      x-roles:
      - ENGINEER
      parameters:
      - name: baselineRunId
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/ResourceId'
      - name: candidateRunId
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/ResourceId'
      - name: scenarioKey
        in: query
        schema:
          type: string
          minLength: 1
          maxLength: 120
      responses:
        200:
          description: 指标差值与证据计数
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComparisonEnvelope'
        401:
          $ref: '#/components/responses/Unauthorized'
        404:
          $ref: '#/components/responses/NotFound'
        422:
          $ref: '#/components/responses/Unprocessable'
        403:
          $ref: '#/components/responses/Forbidden'
        409:
          $ref: '#/components/responses/Conflict'
        500:
          $ref: '#/components/responses/InternalError'
      description: ENGINEER可读；不传baselineRunId只返回当前结果。网页首开另沿用任务原基线；显式取消比较不改变数据库。要求同项目／数据／Benchmark／Episode／Seed、不同模型且两侧成功；指标单位、方向或样本数不一致时NOT_COMPARABLE。
  /api/anomaly-samples:
    get:
      tags:
      - Anomaly
      operationId: listAnomalySamples
      x-implementation-status: implemented
      summary: 筛选异常样本
      x-roles:
      - ENGINEER
      - REVIEWER
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - name: runId
        in: query
        schema:
          $ref: '#/components/schemas/ResourceId'
        required: true
      - name: scenarioKey
        in: query
        schema:
          type: string
          minLength: 1
          maxLength: 120
      - name: metricKey
        in: query
        description: 从对比页下钻时保留的指标筛选
        schema:
          type: string
          minLength: 1
          maxLength: 120
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/SampleStatus'
      - name: reviewState
        in: query
        schema:
          type: string
          enum:
          - pending
          - confirmed
      responses:
        200:
          description: 样本列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SampleListEnvelope'
        401:
          $ref: '#/components/responses/Unauthorized'
        422:
          $ref: '#/components/responses/Unprocessable'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        409:
          $ref: '#/components/responses/Conflict'
        500:
          $ref: '#/components/responses/InternalError'
      description: runId必填，成功且未隐藏任务。status与reviewState同时传入时取交集；按sampleNumber、ID升序。
  /api/anomaly-samples/{sampleId}:
    get:
      tags:
      - Anomaly
      operationId: getAnomalySample
      x-implementation-status: implemented
      summary: 获取样本证据、当前复核与历史
      x-roles:
      - ENGINEER
      - REVIEWER
      parameters:
      - $ref: '#/components/parameters/SampleId'
      - name: runId
        in: query
        description: 可选父任务校验；不匹配返回404。
        schema:
          $ref: '#/components/schemas/ResourceId'
      responses:
        200:
          description: 样本详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SampleEnvelope'
        401:
          $ref: '#/components/responses/Unauthorized'
        404:
          $ref: '#/components/responses/NotFound'
        403:
          $ref: '#/components/responses/Forbidden'
        409:
          $ref: '#/components/responses/Conflict'
        422:
          $ref: '#/components/responses/Unprocessable'
        500:
          $ref: '#/components/responses/InternalError'
  /api/anomaly-samples/{sampleId}/assignment:
    patch:
      tags:
      - Anomaly
      operationId: assignAnomalySample
      x-implementation-status: planned
      summary: 指派异常样本负责人
      x-roles:
      - ENGINEER
      - REVIEWER
      parameters:
      - $ref: '#/components/parameters/SampleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignmentRequest'
      responses:
        200:
          description: 更新后的样本
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SampleEnvelope'
        401:
          $ref: '#/components/responses/Unauthorized'
        404:
          $ref: '#/components/responses/NotFound'
        409:
          $ref: '#/components/responses/Conflict'
        422:
          $ref: '#/components/responses/Unprocessable'
      x-design-status: needs-detail
  /api/anomaly-samples/{sampleId}/review:
    patch:
      tags:
      - Anomaly
      operationId: reviewAnomalySample
      x-implementation-status: implemented
      summary: 保存草稿，或由评测人员确认／修改最终结论
      x-roles:
      - ENGINEER
      - REVIEWER
      description: 同源写入；工程师仅本人任务draft，REVIEWER可draft/confirm。expectedVersion从1开始；冲突409不覆盖。编辑版本每次保存增加，最终文本变化才增加confirmedRevision及标记关联旧报告过时；相同文本确认不增加修订号。任务被隐藏后拒绝写入。
      parameters:
      - $ref: '#/components/parameters/SampleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewRequest'
      responses:
        200:
          description: 更新后的样本、草稿与确认版本
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewEnvelope'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        409:
          $ref: '#/components/responses/Conflict'
        422:
          $ref: '#/components/responses/Unprocessable'
        500:
          $ref: '#/components/responses/InternalError'
  /api/anomaly-samples/{sampleId}/reopen:
    post:
      tags:
      - Anomaly
      operationId: reopenAnomalySample
      x-implementation-status: planned
      summary: 重新打开已解决的异常样本
      x-roles:
      - REVIEWER
      description: 后续切片细化；仅 REVIEWER，保留已确认内容与历史，不属于当前演示主线。若撤销当前确认，相关报告必须标记过时。
      parameters:
      - $ref: '#/components/parameters/SampleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReopenSampleRequest'
      responses:
        200:
          description: 重开后的样本及复核历史
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SampleEnvelope'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        409:
          $ref: '#/components/responses/Conflict'
        422:
          $ref: '#/components/responses/Unprocessable'
      x-design-status: needs-detail
  /api/assistant/sessions:
    get:
      tags:
        - Assistant
      operationId: listAssistantSessions
      x-implementation-status: implemented
      x-roles:
        - ENGINEER
        - REVIEWER
      summary: 当前登录的对话，最多 40 条
      responses:
        '200':
          description: 成功；重复请求返回已存在记录
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AssistantSession'
                  meta:
                    $ref: '#/components/schemas/RequestMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
        - Assistant
      operationId: createAssistantSession
      x-implementation-status: implemented
      x-roles:
        - ENGINEER
        - REVIEWER
      summary: 绑定成功任务与可选基线；不调用模型
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAssistantSession'
      responses:
        '200':
          description: 成功；重复请求返回已存在记录
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    $ref: '#/components/schemas/AssistantSession'
                  meta:
                    $ref: '#/components/schemas/RequestMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          description: 本次登录对话已达 40 个
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/assistant/sessions/{sessionId}:
    get:
      tags:
        - Assistant
      operationId: getAssistantSession
      x-implementation-status: implemented
      x-roles:
        - ENGINEER
        - REVIEWER
      summary: 恢复当前登录的历史并标记过时回答
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ResourceId'
      responses:
        '200':
          description: 成功；重复请求返回已存在记录
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: object
                    required:
                      - session
                      - turns
                    properties:
                      session:
                        $ref: '#/components/schemas/AssistantSession'
                      turns:
                        type: array
                        items:
                          $ref: '#/components/schemas/AssistantTurn'
                  meta:
                    $ref: '#/components/schemas/RequestMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/assistant/sessions/{sessionId}/messages:
    post:
      tags:
        - Assistant
      operationId: sendAssistantMessage
      x-implementation-status: implemented
      x-roles:
        - ENGINEER
        - REVIEWER
      summary: 发送新问题并返回逐行 JSON 流
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendAssistantMessage'
      responses:
        '200':
          description: 每行独立 AssistantEvent，以换行结尾；不是单个 JSON 数组，也不是 SSE
          content:
            application/x-ndjson:
              schema:
                $ref: '#/components/schemas/AssistantEvent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          description: 声明的请求体过大
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          description: 频率、并发或累计预算上限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: 模型或预算配置不正确
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      description: >-
        仅发送新问题，历史与角色由服务器读取。requestKey 必须为 UUID；同会话同键同问题和样本不重复调用，不同内容 409。60 秒、最多 6 次模型／8 次工具；单次登录仅一轮运行。流开始后失败也以 HTTP 200
        内的 done 终态或 error 事件返回，不能只检查 HTTP 状态。
