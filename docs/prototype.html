<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SimEval · 阶段 1.5 体验原型</title>
  <style>
    :root{font-family:Inter,"Microsoft YaHei",system-ui,sans-serif;color:#182b38;background:#f2f5f6;font-size:14px}
    *{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}
    .app{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:100vh}.side{background:#112d39;color:#d2e1e6;padding:22px 14px;position:sticky;top:0;height:100vh}
    .brand{font-size:23px;font-weight:800;letter-spacing:-.04em;color:#fff;padding:4px 12px 19px}.brand small{display:block;font-size:11px;letter-spacing:.08em;font-weight:600;color:#90afb8;margin-top:5px}
    nav{display:grid;gap:5px}nav button{width:100%;text-align:left;background:transparent;border:0;color:#b9d0d8;padding:11px 13px;border-radius:8px}nav button:hover,nav button.active{background:#255364;color:#fff}
    .sideNote{position:absolute;bottom:20px;left:25px;right:25px;color:#91afba;font-size:11px;line-height:1.6}
    main{min-width:0}.top{display:flex;align-items:center;justify-content:space-between;gap:15px;background:#fff;border-bottom:1px solid #dce5e8;padding:13px 30px}.crumb{font-size:12px;color:#617580}.topRight{display:flex;align-items:center;gap:10px}.badge{display:inline-block;padding:5px 9px;border-radius:5px;font-weight:700;font-size:11px;letter-spacing:.03em}.sim{background:#ecf5f7;color:#1d6574}.warn{background:#fff1d8;color:#875b0a}.good{background:#e0f3e8;color:#17653c}.bad{background:#fde7e5;color:#a53932}.muted{background:#e9eef0;color:#52636c}
    .wrap{max-width:1260px;margin:auto;padding:28px 30px 60px}.hero{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:22px}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.12em;color:#3c7b87;text-transform:uppercase}.hero h1{font-size:29px;line-height:1.2;margin:6px 0}.subtitle{margin:0;color:#5c6f79;line-height:1.6}.actions{display:flex;gap:8px;flex-wrap:wrap}
    .btn{border:1px solid #c5d4da;background:#fff;color:#244553;border-radius:7px;padding:9px 13px;font-weight:700}.btn:hover{background:#f0f7f8}.btn.primary{background:#087e79;border-color:#087e79;color:white}.btn.primary:hover{background:#086b67}.btn.danger{color:#a53d33}.btn:disabled{opacity:.45;cursor:not-allowed}
    .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.panel{background:#fff;border:1px solid #dce6e9;border-radius:10px;padding:18px;margin-bottom:15px;box-shadow:0 2px 7px #17384908}.panel h2{font-size:16px;margin:0 0 13px}.panel h3{font-size:13px;margin:0 0 9px}.metric{font-size:30px;font-weight:800;line-height:1.2}.mini{font-size:12px;color:#647781}.note{background:#f7fafb;border-left:3px solid #4a8591;padding:12px 14px;line-height:1.6;margin:14px 0}.alert{background:#fff8e9;border:1px solid #efd59b;border-radius:8px;padding:14px 16px;line-height:1.6;margin-bottom:15px}.alert.error{background:#fff1ef;border-color:#e9b3ac}.alert.success{background:#edf8f1;border-color:#a9d7ba}
    .tableScroll{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:680px}th{text-align:left;color:#647783;font-size:11px;text-transform:uppercase;letter-spacing:.05em;background:#f7fafb}td,th{border-bottom:1px solid #e7edef;padding:11px 10px;vertical-align:middle}tr:last-child td{border-bottom:0}.link{border:0;background:transparent;color:#087e79;padding:0;font-weight:800;text-align:left}.link:hover{text-decoration:underline}.down{font-weight:800;color:#a73d34}.up{font-weight:800;color:#176944}.filterbar{display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin-bottom:14px}.field{display:grid;gap:6px;min-width:160px;font-weight:700;font-size:12px;color:#455d68}.field input,.field select,.field textarea{width:100%;border:1px solid #c7d5d9;border-radius:7px;padding:9px 10px;background:#fff;color:#182b38;font-weight:400}.field textarea{min-height:82px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid #92cac7;outline-offset:1px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.split{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(320px,1fr);gap:15px}.stack{display:grid;gap:10px}.check{display:flex;gap:9px;align-items:flex-start;line-height:1.5}.check input{margin-top:3px}.log{background:#102b35;color:#d5e8e9;border-radius:8px;padding:16px;font:12px/1.65 Consolas,monospace;white-space:pre-wrap;min-height:155px}.media{height:170px;border:1px dashed #9eb6be;border-radius:8px;display:grid;place-items:center;background:repeating-linear-gradient(45deg,#f7fafb,#f7fafb 12px,#eef4f6 12px,#eef4f6 24px);color:#5c7480;text-align:center}.tabs{display:flex;gap:8px;border-bottom:1px solid #dce6e9;margin-bottom:14px}.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;color:#647783}.tabs button.active{border-color:#087e79;color:#0c5d5a;font-weight:800}.timeline{display:grid;gap:11px}.timeline div{border-left:2px solid #a5c8cb;padding-left:12px;line-height:1.5}.reportQuote{font-size:16px;line-height:1.75;border-left:4px solid #0f817b;padding:12px 17px;background:#f5faf9}.hidden{display:none!important}.toast{position:fixed;right:22px;bottom:22px;max-width:380px;background:#173946;color:white;padding:13px 17px;border-radius:8px;box-shadow:0 6px 20px #0a202944;z-index:10}.footer{font-size:11px;color:#82929b;margin-top:20px}
    @media(max-width:900px){.app{grid-template-columns:1fr}.side{position:static;height:auto;padding:10px}.brand{padding:4px 8px;font-size:17px}.brand small,.sideNote{display:none}nav{display:flex;overflow-x:auto}nav button{white-space:nowrap;width:auto}.wrap{padding:20px 14px}.top{padding:10px 14px}.grid,.split{grid-template-columns:1fr}.hero{display:block}.hero .actions{margin-top:14px}}
    @media(max-width:550px){.formgrid{grid-template-columns:1fr}.topRight{flex-wrap:wrap;justify-content:end}.hero h1{font-size:24px}}
  </style>
</head>
<body>
<div class="app">
  <aside class="side"><div class="brand">SimEval<small>评测数据工作台 · 体验原型</small></div><nav id="nav"></nav><div class="sideNote">阶段 1.5 · 所有数值及样本均为合成示例。此文件不连接服务端，也不会持久化。</div></aside>
  <main><header class="top"><span class="crumb" id="crumb">Warehouse Manipulation / 总览</span><div class="topRight"><span class="badge sim">模拟数据 · 原型</span><label class="field" style="min-width:120px">演示角色<select id="role"><option value="ENGINEER">ENGINEER</option><option value="REVIEWER">REVIEWER</option><option value="ADMIN">ADMIN</option></select></label></div></header><div class="wrap" id="view"></div></main>
</div>
<div class="toast hidden" id="toast" role="status" aria-live="polite"></div>
<script>
const navItems=[['dashboard','总览'],['quality','数据集质量'],['runs','评测任务'],['comparison','模型对比'],['samples','异常样本'],['backfill','回补任务'],['report','评测报告']];
const state={page:'dashboard',role:'ENGINEER',accepted:false,run:'none',scene:'all',sample:'sample_017',category:'',conclusion:'',assignee:{},resolved:{},backfill:false,report:'none',sampleFilter:'all',returnTo:'comparison'};
const samples=[{id:'sample_017',scene:'occlusion',type:'碰撞',hint:'抓取点标注偏移',category:'DATA_ISSUE'},{id:'sample_018',scene:'occlusion',type:'碰撞',hint:'机械臂接近路径过窄',category:'MODEL_ISSUE'},{id:'sample_023',scene:'clear',type:'人工干预',hint:'需人工判断',category:'UNKNOWN'}];
const view=document.getElementById('view');
function btn(label,action,cls=''){return `<button class="btn ${cls}" data-action="${action}">${label}</button>`}
function link(label,action){return `<button class="link" data-action="${action}">${label}</button>`}
function badge(label,cls){return `<span class="badge ${cls}">${label}</span>`}
function toast(message){const el=document.getElementById('toast');el.textContent=message;el.classList.remove('hidden');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.add('hidden'),3800)}
function go(page){state.page=page;location.hash=page;render();window.scrollTo(0,0)}
function title(kicker,name,subtitle,actions=''){return `<div class="hero"><div><div class="eyebrow">${kicker}</div><h1>${name}</h1><p class="subtitle">${subtitle}</p></div><div class="actions">${actions}</div></div>`}
function renderNav(){document.getElementById('nav').innerHTML=navItems.map(([id,label])=>`<button class="${state.page===id?'active':''}" data-go="${id}">${label}</button>`).join('')}
function dashboard(){return title('工作台','今天的评测决策','从数据质量到人工确认，追踪每条结论的来源。',btn('查看数据集质量','quality','primary'))+`<div class="grid"><section class="panel"><h2>数据质量</h2>${badge('WARNING','warn')}<p class="metric">18 <span class="mini">条待复核标注</span></p>${link('查看质量报告 →','quality')}</section><section class="panel"><h2>候选模型评测</h2>${badge(state.run==='succeeded'?'SUCCEEDED':state.run==='none'?'尚未创建':state.run.toUpperCase(),state.run==='succeeded'?'good':'muted')}<p class="metric">v2.4</p>${link('查看评测任务 →','runs')}</section><section class="panel"><h2>待复核异常</h2>${badge('合成示例','sim')}<p class="metric">${2-Object.keys(state.resolved).length}</p>${link('进入样本队列 →','samples')}</section></div><div class="panel"><h2>固定演示故事</h2><p>候选模型总体成功率提高，但遮挡场景碰撞率回退。调查样本后，一条归为模型问题，一条归为数据问题；数据问题进入回补任务，AI 草稿由人确认。</p><div class="note">本原型用于验证信息层级与任务流。按钮仅改变浏览器内的演示状态；刷新后重置，不能证明持久化或权限控制。</div></div>`}
function quality(){return title('01 / 数据质量','warehouse-scenes-v3','12,000 条合成样本 · Warehouse Manipulation · 数据集版本 v3',btn('用此数据集创建评测','runs','primary'))+`<div class="alert"><strong>WARNING · 可以继续，但需要明确接受警告</strong><br>遮挡场景有 18 条抓取点标注需要复核。评测结论应保留这项质量背景。</div><div class="grid"><div class="panel"><h2>总体状态</h2>${badge('WARNING','warn')}<p class="mini">FAILED 才阻止创建；此状态需要确认。</p></div><div class="panel"><h2>样本规模</h2><div class="metric">12,000</div><p class="mini">固定演示数据</p></div><div class="panel"><h2>遮挡场景警告</h2><div class="metric">18</div><p class="mini">需复核标注</p></div></div><div class="panel"><h2>质量检查项</h2><div class="tableScroll"><table><thead><tr><th>检查项</th><th>状态</th><th>影响数</th><th>解释</th></tr></thead><tbody><tr><td>必填字段</td><td>${badge('通过','good')}</td><td>0</td><td>模型所需元数据完整</td></tr><tr><td>无效标注</td><td>${badge('警告','warn')}</td><td>18</td><td>遮挡场景抓取点待核</td></tr><tr><td>媒体引用</td><td>${badge('通过','good')}</td><td>0</td><td>示例引用可用</td></tr><tr><td>场景分布</td><td>${badge('通过','good')}</td><td>0</td><td>包含遮挡与无遮挡切片</td></tr></tbody></table></div></div>`}
function runs(){let can=state.role!=='REVIEWER';return title('02 / 评测任务','创建候选模型评测','任务配置可追溯，执行结果由确定性模拟 Provider 产生。')+`<div class="split"><section class="panel"><h2>创建评测</h2>${!can?'<div class="alert error">当前角色只能查看评测。创建、取消和重试需要 ENGINEER 或 ADMIN。</div>':''}<div class="formgrid"><label class="field">模型版本<select disabled><option>grasp-policy-v2.4</option></select></label><label class="field">数据集版本<select disabled><option>warehouse-scenes-v3 · WARNING</option></select></label><label class="field">Benchmark<select disabled><option>warehouse-pick-benchmark</option></select></label><label class="field">基线任务<select disabled><option>grasp-policy-v2.3 · SUCCEEDED</option></select></label><label class="field">Episode 数<input value="500" disabled></label><label class="field">模拟 Seed<input value="42" disabled></label></div><p class="mini">以上是固定任务配置。正式产品由服务端校验兼容性。</p><label class="check"><input type="checkbox" id="acceptWarning" ${state.accepted?'checked':''} ${!can?'disabled':''}>我已了解数据集质量 WARNING，仍要继续创建评测。</label><div class="actions" style="margin-top:16px">${btn('创建模拟评测','createRun','primary')}</div></section><section class="panel"><h2>任务状态</h2>${badge(state.run==='none'?'尚未创建':state.run.toUpperCase(),state.run==='succeeded'?'good':'muted')}<p class="note">状态演示：创建后可推进 QUEUED → RUNNING → SUCCEEDED。真实实现由服务端时间与固定 Seed 驱动，刷新后仍可读取。</p><div class="actions">${state.run==='queued'?btn('模拟进入 RUNNING','advanceRun'):''}${state.run==='running'?btn('模拟执行完成','advanceRun'):''}${state.run==='succeeded'?btn('与基线比较','comparison','primary'):''}</div><h3 style="margin-top:24px">基线任务</h3><p>grasp-policy-v2.3 · 已完成 · 500 Episodes</p></section></div>`}
function comparison(){return title('03 / 模型对比','候选 v2.4 与基线 v2.3','同一数据集、Benchmark 与 500 Episodes；数值仅供体验走查。',btn('查看遮挡异常样本','drill','primary'))+`<div class="alert"><strong>决策摘要：</strong>总体成功率提升 5 个百分点；遮挡场景碰撞率增加 5 个百分点，属于回退。应进入证据样本区分模型与数据原因。</div><div class="panel"><h2>比较口径</h2><div class="grid"><div><span class="mini">基线</span><h3>grasp-policy-v2.3</h3></div><div><span class="mini">候选</span><h3>grasp-policy-v2.4</h3></div><div><span class="mini">共同配置</span><h3>warehouse-scenes-v3 · warehouse-pick-benchmark</h3></div></div></div><div class="panel"><div class="filterbar"><label class="field">场景<select id="scene"><option value="all" ${state.scene==='all'?'selected':''}>全部场景</option><option value="occlusion" ${state.scene==='occlusion'?'selected':''}>遮挡场景</option></select></label><span class="mini">数值含单位；改善和回退以文字表达。</span></div><div class="tableScroll"><table><thead><tr><th>指标 / 场景</th><th>方向</th><th>基线</th><th>候选</th><th>差值</th><th>判断</th><th>证据</th></tr></thead><tbody>${state.scene==='all'?'<tr><td>成功率 / 总体</td><td>越高越好</td><td>76 %</td><td>81 %</td><td>+5 pp</td><td><span class="up">↑ 改善</span></td><td>—</td></tr><tr><td>平均完成时间 / 总体</td><td>越低越好</td><td>12.1 s</td><td>11.6 s</td><td>-0.5 s</td><td><span class="up">↓ 改善</span></td><td>—</td></tr>':''}<tr><td>碰撞率 / 遮挡</td><td>越低越好</td><td>8 %</td><td>13 %</td><td>+5 pp</td><td><span class="down">↑ 回退</span></td><td>${link('查看关联样本 →','drill')}</td></tr>${state.scene==='all'?'<tr><td>人工干预率 / 总体</td><td>越低越好</td><td>7 %</td><td>6 %</td><td>-1 pp</td><td><span class="up">↓ 改善</span></td><td>—</td></tr>':''}</tbody></table></div></div>`}
function sampleList(){let list=samples.filter(s=>state.sampleFilter==='all'||s.scene===state.sampleFilter);return title('04 / 异常样本','证据样本队列','按任务、场景和复核状态定位具体 Episode；返回时保留筛选。')+`<div class="panel"><div class="filterbar"><label class="field">场景<select id="sampleFilter"><option value="all" ${state.sampleFilter==='all'?'selected':''}>全部</option><option value="occlusion" ${state.sampleFilter==='occlusion'?'selected':''}>遮挡场景</option><option value="clear" ${state.sampleFilter==='clear'?'selected':''}>无遮挡场景</option></select></label>${state.sampleFilter!=='all'?btn('清除筛选','clearFilter'):''}<span class="mini">候选任务 grasp-policy-v2.4 · ${list.length} 条示例结果</span></div><div class="tableScroll"><table><thead><tr><th>样本编号</th><th>场景</th><th>异常</th><th>状态</th><th>负责人</th><th>操作</th></tr></thead><tbody>${list.map(s=>`<tr><td>${s.id}</td><td>${s.scene==='occlusion'?'遮挡':'无遮挡'}</td><td>${s.type}</td><td>${badge(state.resolved[s.id]?'RESOLVED':'OPEN',state.resolved[s.id]?'good':'muted')}</td><td>${state.assignee[s.id]?'评测人员':'未指派'}</td><td>${link('查看并复核 →','open:'+s.id)}</td></tr>`).join('')}</tbody></table></div></div>`}
function sampleDetail(){let s=samples.find(x=>x.id===state.sample)||samples[0];let resolved=state.resolved[s.id];return title('05 / 人工复核',s.id,`候选 v2.4 · ${s.scene==='occlusion'?'遮挡场景':'无遮挡场景'} · ${s.type}`,btn('返回筛选列表','samples'))+`<div class="note">来源：模型对比 → 碰撞率 / 遮挡 → 异常样本。${link('返回模型对比','comparison')}</div><div class="split"><section class="panel"><h2>样本证据</h2><div class="media">合成场景占位<br>此原型未加载真实影像或轨迹</div><h3 style="margin-top:17px">日志摘录 · 模拟</h3><div class="log">episode: ${s.id}\nscene: ${s.scene}\nanomaly: ${s.type}\nreview_hint: ${s.hint}\nsource: deterministic seed 42</div><p class="mini">生产页面需展示具体证据来源与字段缺失状态。</p></section><section class="panel"><h2>复核动作 ${badge(resolved?'RESOLVED':'OPEN',resolved?'good':'muted')}</h2><div class="stack"><label class="field">负责人<select id="assignee"><option value="none" ${!state.assignee[s.id]?'selected':''}>未指派</option><option value="reviewer" ${state.assignee[s.id]?'selected':''}>评测人员</option></select></label><label class="field">原因分类<select id="category"><option value="">请选择</option><option value="MODEL_ISSUE" ${state.category==='MODEL_ISSUE'?'selected':''}>模型问题</option><option value="DATA_ISSUE" ${state.category==='DATA_ISSUE'?'selected':''}>数据问题</option><option value="INVALID_SAMPLE" ${state.category==='INVALID_SAMPLE'?'selected':''}>无效样本</option><option value="FALSE_POSITIVE" ${state.category==='FALSE_POSITIVE'?'selected':''}>误报</option><option value="UNKNOWN" ${state.category==='UNKNOWN'?'selected':''}>暂无法判断</option></select></label><label class="field">人工结论<textarea id="conclusion" placeholder="写明判断依据和需要的下一步">${state.conclusion}</textarea></label><div class="mini">解决需要负责人、分类和结论；仅 REVIEWER/ADMIN 可解决。</div><div class="actions">${btn('保存复核草稿','saveReview')}${btn('解决样本','resolve','primary')}</div>${state.category==='DATA_ISSUE'||state.category==='INVALID_SAMPLE'?`<div class="alert">这是可回补分类。解决后可创建轻量回补任务，不触发真实数据管道。</div>`:''}</div></section></div><section class="panel"><h2>复核历史</h2><div class="timeline"><div>示例任务生成 · ${s.id} 进入 OPEN</div>${state.assignee[s.id]?'<div>负责人已设为评测人员（原型状态）</div>':''}${resolved?`<div>${state.role} 将样本解决为 ${resolved.category}：${resolved.conclusion}</div>`:''}</div></section>`}
function backfill(){return title('06 / 数据回补','回补任务','仅记录来源样本、原因、负责人和处理进度；不执行采集或 ETL。',btn('返回异常样本','samples'))+`<div class="panel"><h2>来源与责任</h2><p>来源样本：${link('sample_017','open:sample_017')} · 问题：遮挡场景抓取点标注偏移</p><p>当前任务：${state.backfill?badge('OPEN','warn'):badge('尚未创建','muted')}</p>${state.role==='ENGINEER'?'<div class="alert error">当前角色无权创建或处理回补任务；需要 REVIEWER 或 ADMIN。</div>':''}<div class="actions">${btn('创建回补任务','createBackfill','primary')}</div></div>`}
function report(){return title('07 / 评测报告','证据驱动的报告','AI 只生成草稿；最终结论由人工确认。',btn('生成 AI 草稿','generate','primary'))+`${state.report==='none'?'<div class="panel"><h2>尚无报告</h2><p>需要候选评测和人工复核结果作为输入。原型将使用固定合成故事预览报告结构。</p></div>':`<div class="alert ${state.report==='confirmed'?'success':''}"><strong>${state.report==='confirmed'?'已由人工确认':'AI 草稿 · 尚未人工确认'}</strong><br>这是一份静态演示报告，未调用 AI 服务。正式系统须校验结构和样本引用。</div><div class="panel"><h2>结论草稿</h2><div class="reportQuote">候选模型总体成功率由 76% 提升至 81%，但遮挡场景碰撞率由 8% 升至 13%。回退样本包含模型路径问题和数据标注问题；建议在发布判断前核查两类证据与回补进度。</div><h3 style="margin-top:22px">证据链</h3><p>指标：${link('遮挡场景碰撞率 +5 pp','comparison')} · 样本：${link('sample_017','open:sample_017')}（数据问题）、${link('sample_018','open:sample_018')}（模型问题）</p><p class="mini">输入快照：warehouse-scenes-v3 / grasp-policy-v2.3 vs v2.4 / 500 Episodes / Seed 42</p><label class="check"><input type="checkbox" id="verifyEvidence">我已检查指标、样本编号和人工结论。</label><div class="actions" style="margin-top:14px">${btn('确认报告','confirm','primary')}</div></div>`}`}
function render(){renderNav();document.getElementById('crumb').textContent='Warehouse Manipulation / '+(navItems.find(x=>x[0]===state.page)?.[1]||'异常样本详情');document.getElementById('role').value=state.role;view.innerHTML=({dashboard,quality,runs,comparison,samples:sampleList,detail:sampleDetail,backfill,report}[state.page]||dashboard)()+`<div class="footer">SimEval 阶段 1.5 体验原型 · 所有业务数据为合成示例 · 无后端、权限执行或持久化</div>`}
document.addEventListener('click',e=>{let goTo=e.target.closest('[data-go]');if(goTo){go(goTo.dataset.go);return}let b=e.target.closest('[data-action]');if(!b)return;let a=b.dataset.action;if(a.startsWith('open:')){state.sample=a.slice(5);state.category='';state.conclusion='';go('detail');return}if(navItems.some(x=>x[0]===a)){go(a);return}switch(a){case 'drill':state.sampleFilter='occlusion';go('samples');break;case 'clearFilter':state.sampleFilter='all';render();break;case 'createRun':if(state.role==='REVIEWER'){toast('当前角色无权创建评测');break}if(!state.accepted){toast('请先明确接受数据质量警告');break}state.run='queued';render();toast('模拟任务已创建：QUEUED');break;case 'advanceRun':state.run=state.run==='queued'?'running':'succeeded';render();toast('原型状态：'+state.run.toUpperCase());break;case 'saveReview':state.conclusion=document.getElementById('conclusion').value;toast('复核草稿已暂存在当前页面会话');break;case 'resolve':state.conclusion=document.getElementById('conclusion').value.trim();if(state.role==='ENGINEER'){toast('解决样本需要 REVIEWER 或 ADMIN');break}if(!state.assignee[state.sample]||!state.category||!state.conclusion){toast('请填写负责人、分类和人工结论');break}state.resolved[state.sample]={category:state.category,conclusion:state.conclusion};render();toast('样本已标记为解决（原型状态）');break;case 'createBackfill':if(state.role==='ENGINEER'){toast('创建回补任务需要 REVIEWER 或 ADMIN');break}if(state.resolved.sample_017?.category!=='DATA_ISSUE'&&state.resolved.sample_017?.category!=='INVALID_SAMPLE'){toast('先将 sample_017 复核为数据问题或无效样本');break}state.backfill=true;render();toast('回补任务已创建（原型状态）');break;case 'generate':if(state.run!=='succeeded'||state.resolved.sample_017?.category!=='DATA_ISSUE'||state.resolved.sample_018?.category!=='MODEL_ISSUE'||!state.backfill){toast('请先完成候选评测、两类证据样本复核及数据回补任务');break}state.report='draft';render();toast('已打开固定报告草稿；未调用 AI');break;case 'confirm':if(state.role==='ENGINEER'){toast('确认报告需要 REVIEWER 或 ADMIN');break}if(!document.getElementById('verifyEvidence')?.checked){toast('请先检查证据并勾选确认');break}state.report='confirmed';render();toast('报告已标记为人工确认（原型状态）');break;default:toast('原型尚未覆盖此动作')}});
document.addEventListener('change',e=>{switch(e.target.id){case 'role':state.role=e.target.value;render();break;case 'acceptWarning':state.accepted=e.target.checked;break;case 'scene':state.scene=e.target.value;render();break;case 'sampleFilter':state.sampleFilter=e.target.value;render();break;case 'assignee':state.assignee[state.sample]=e.target.value==='reviewer';break;case 'category':state.category=e.target.value;render();break}});
document.addEventListener('input',e=>{if(e.target.id==='conclusion')state.conclusion=e.target.value});
window.addEventListener('hashchange',()=>{let p=location.hash.slice(1);if(navItems.some(x=>x[0]===p)){state.page=p;render()}});if(navItems.some(x=>x[0]===location.hash.slice(1)))state.page=location.hash.slice(1);render();
</script>
</body>
